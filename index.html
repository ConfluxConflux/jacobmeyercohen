<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jacob Meyer Cohen</title>
  <meta name="description" content="On leave from Stanford University, working to address civilization-scale risk from AI. Previously a New York Times-published puzzle creator and Manifold political columnist.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://confluxconflux.github.io/jacobmeyercohen/">
  <meta property="og:title" content="Jacob Meyer Cohen">
  <meta property="og:description" content="On leave from Stanford University, working to address civilization-scale risk from AI. Previously a New York Times-published puzzle creator and Manifold political columnist.">
  <meta property="og:image" content="https://confluxconflux.github.io/jacobmeyercohen/images/jacob.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="800">
  <meta property="og:image:alt" content="Headshot of Jacob Meyer Cohen">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="images/jacob.jpg">
  <link rel="apple-touch-icon" href="images/jacob.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <img id="photo" class="photo" alt="" hidden>
      <div class="intro-text">
        <h1 id="name"></h1>
        <p id="blurb" class="blurb"></p>
        <nav id="links" class="links"></nav>
        <p id="copied" class="copied" aria-live="polite"></p>
      </div>
    </header>

    <div id="sections"></div>

    <footer id="footer" class="footer"></footer>
  </main>

  <button type="button" id="theme-btn" class="theme-btn" title="Cycle color theme">Theme</button>

  <script src="content.js"></script>
  <script>
  (function () {
    var s = window.SITE || {};
    // Theme: ?theme= in the URL, else the visitor's last pick, else content.js.
    var THEMES = ["default", "silver", "lavender", "seaglass", "midnight"];
    var NAMES = { default: "Tan", silver: "Silver", lavender: "Lavender", seaglass: "Sea glass", midnight: "Midnight" };
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var theme = new URLSearchParams(location.search).get("theme") || saved || s.theme || "default";
    if (THEMES.indexOf(theme) < 0) theme = "default";
    function applyTheme(t) {
      if (t === "default") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", t);
      var b = document.getElementById("theme-btn");
      if (b) b.textContent = "Theme: " + NAMES[t];
    }
    applyTheme(theme);
    document.getElementById("theme-btn").onclick = function () {
      theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      applyTheme(theme);
      try { localStorage.setItem("theme", theme); } catch (e) {}
    };
    var $ = function (id) { return document.getElementById(id); };
    var external = function (h) { return /^https?:/.test(h); };

    $("name").textContent = s.name || "";
    document.title = s.name || document.title;
    $("blurb").innerHTML = s.blurb || "";
    $("footer").innerHTML = s.footer || "";
    if (s.photo) { $("photo").src = s.photo; $("photo").alt = s.name || ""; $("photo").hidden = false; }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      var t = document.createElement("textarea");
      t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } finally { t.remove(); }
      return Promise.resolve();
    }

    // mailto: links copy the address instead of opening a mail app
    (s.links || []).forEach(function (l) {
      var href = l.href || "";
      if (/^mailto:/.test(href)) {
        var addr = href.replace(/^mailto:/, "");
        var b = document.createElement("button");
        b.type = "button"; b.textContent = l.label;
        b.onclick = function () {
          var msg = $("copied");
          msg.innerHTML = '<span class="addr"></span><span class="note"></span>';
          msg.firstChild.textContent = addr;
          msg.classList.add("show");
          copyText(addr).then(function () {
            msg.lastChild.textContent = "copied to your clipboard!";
          }, function () {});
        };
        $("links").appendChild(b);
      } else {
        var a = document.createElement("a");
        a.href = href; a.textContent = l.label;
        if (external(href)) { a.target = "_blank"; a.rel = "noopener"; }
        $("links").appendChild(a);
      }
    });

    // cardStyle: "banner" (wide image on top), "logo" (small square logo above the text),
    // "row" (one box per line, square logo on the left). Square logos live in images/square/.
    // ?style=logo or ?style=banner in the URL overrides content.js, for comparing.
    var cardStyle = new URLSearchParams(location.search).get("style") || s.cardStyle || "banner";
    document.body.classList.add("cards-" + cardStyle);

    function top(it) {
      if (cardStyle === "logo" || cardStyle === "row") {
        if (!it.image) return '<div class="logo-sq mark"><span>' + (it.mark || "") + '</span></div>';
        var sq = it.image.replace("images/cards/", "images/square/");
        return '<div class="logo-sq' + (/\.svg$/.test(sq) ? " contain" : "") + '"><img src="' + sq + '" alt=""></div>';
      }
      if (it.image) {
        // Phones get the square twin from images/square/ (same filename) when one exists.
        var sq = /^images\/cards\//.test(it.image) ? it.image.replace("images/cards/", "images/square/") : "";
        return '<div class="top ' + (it.fit === "cover" ? "cover" : "logo") + '"><picture>' +
          (sq ? '<source media="(max-width: 600px)" srcset="' + sq + '">' : '') +
          '<img src="' + it.image + '" alt=""></picture></div>';
      }
      var mark = it.mark || (it.title || "").split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 3);
      return '<div class="top mark"><span>' + mark + '</span></div>';
    }

    // Linked cards are divs with a full-card overlay link, so blurbs can hold their own links.
    function card(it) {
      var link = it.href ? '<a class="card-link" href="' + it.href + '"' +
        (external(it.href) ? ' target="_blank" rel="noopener"' : "") + ' aria-label="' +
        String(it.title || "").replace(/<[^>]*>/g, "").replace(/"/g, "&quot;") + '"></a>' : "";
      return '<div class="card' + (it.href ? " linked" : "") + '">' + link +
        top(it) +
        '<div class="body">' +
          '<h3>' + (it.title || "") + '</h3>' +
          (it.role || it.dates ? '<p class="role">' +
            (it.role ? '<span>' + it.role + '</span>' : '') +
            (it.dates ? '<span class="dates">' + it.dates + '</span>' : '') + '</p>' : '') +
          (it.text ? '<p class="text' + (it.draft ? " draft" : "") + '">' + it.text + '</p>' : '') +
        '</div>' +
      '</div>';
    }

    function section(sec) {
      return '<section><h2>' + (sec.title || "") + '</h2><div class="grid">' +
        (sec.items || []).map(card).join("") + '</div></section>';
    }

    // Consecutive two-item sections share one row (two boxes each, four across).
    function render(list) {
      var out = "", i = 0;
      while (i < list.length) {
        var a = list[i], b = list[i + 1];
        if (b && (a.items || []).length === 2 && (b.items || []).length === 2) {
          out += '<div class="pair-row">' + section(a) + section(b) + '</div>';
          i += 2;
        } else {
          out += section(a);
          i += 1;
        }
      }
      return out;
    }

    // Sections after "showMoreAfter" wait behind a Show more button.
    var secs = s.sections || [];
    var cut = s.showMoreAfter ? secs.findIndex(function (sec) { return sec.title === s.showMoreAfter; }) + 1 : 0;
    if (cut > 0 && cut < secs.length) {
      var hidden = secs.slice(cut);
      $("sections").innerHTML = render(secs.slice(0, cut)) +
        '<div class="more-wrap"><button type="button" id="more" class="more" aria-expanded="false" aria-controls="more-sections">Show more</button></div>' +
        '<div id="more-sections" hidden>' + render(hidden) + '</div>';
      $("more").onclick = function () {
        $("more-sections").hidden = false;
        this.setAttribute("aria-expanded", "true");
        this.parentNode.remove();
      };
    } else {
      $("sections").innerHTML = render(secs);
    }
  })();
  </script>
</body>
</html>
